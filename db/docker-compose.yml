# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: beneficios-postgres
    environment:
      POSTGRES_DB: beneficios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - beneficios-network

volumes:
  postgres_data:

networks:
  beneficios-network:
    driver: bridge